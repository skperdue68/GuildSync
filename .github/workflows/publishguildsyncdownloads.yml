name: Publish GuildSync downloads

on:
  workflow_call:
    inputs:
      release_tag:
        description: Existing release tag whose installer ZIPs should be published
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag, for example v1.3.6 (does not rebuild)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  GO_VERSION: '1.23.x'

jobs:
  publish-downloads:
    name: Publish installer ZIPs and release versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tools
        uses: actions/checkout@v4
        with:
          ref: master
          path: release-source
          sparse-checkout: |
            tools
            .github/workflows
      - name: Checkout downloads directory
        uses: actions/checkout@v4
        with:
          ref: master
          path: downloads-repository
          sparse-checkout: |
            tools
            GO/GuildSync-Frontend-Client
            NodeJS/GuildSync-Backend-Server
            NodeJS/GuildSync-Discord-Bot
            ESO
            Installer/Windows
      - name: Setup Go for repository version synchronization
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Download installer ZIP release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          mkdir installers server-artifacts
          for platform in Windows macOS Linux-x86_64; do
            gh release download "$RELEASE_TAG" --pattern "GuildSync-Setup-$VERSION-$platform.zip" --dir installers
          done
          gh release download "$RELEASE_TAG" --pattern "GuildSync-Server-$VERSION.zip" --dir server-artifacts
      - name: Validate and copy installer ZIPs intact
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 release-source/tools/latest-published-release.test.py
          bash release-source/tools/latest-published-release.test.sh
          python3 release-source/tools/sync-release-web.test.py
          python3 release-source/tools/sync-release-downloads.test.py
          bash release-source/tools/upload-release-downloads.test.sh
          python3 release-source/tools/sync-release-downloads.py --source installers --destination downloads-repository/NodeJS/GuildSync-Backend-Server/public/downloads --version "$RELEASE_TAG"
      - name: Propose installer downloads and release versions in a pull request
        working-directory: downloads-repository
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          PROPOSED=false
          BRANCH="codex/release-version-$VERSION"
          for attempt in 1 2 3; do
            # Only replace our generated publication branch if it has not changed meanwhile.
            REMOTE_HEAD="$(git ls-remote --heads origin "refs/heads/$BRANCH" | cut -f1)"
            # Generated web files stay local; installer ZIPs remain tracked by design.
            git fetch origin master
            git reset --hard origin/master
            python3 ../release-source/tools/sync-release-downloads.py --source ../installers --destination NodeJS/GuildSync-Backend-Server/public/downloads --version "$RELEASE_TAG"
            LATEST_TAG="$(gh api --paginate --slurp "repos/$GH_REPO/releases" | python3 ../release-source/tools/latest-published-release.py)"
            if [[ "$LATEST_TAG" == "$RELEASE_TAG" ]]; then
              python3 ../release-source/tools/sync-release-web.py --bundle "../server-artifacts/GuildSync-Server-$VERSION.zip" --version "$VERSION"
              go run ../release-source/tools/update-version.go "$VERSION"
              go run ../release-source/tools/update-version.go --check "$VERSION"
              git add -- "VERSION" "GO/GuildSync-Frontend-Client/frontend/src/main.js" "NodeJS/GuildSync-Backend-Server/web/src/main.js" "GO/GuildSync-Frontend-Client/wails.json" "ESO/GuildSyncApplications/GuildSyncApplications.lua" "Installer/Windows/GuildSyncInstaller.iss" "GO/GuildSync-Frontend-Client/frontend/package.json" "GO/GuildSync-Frontend-Client/frontend/package-lock.json" "NodeJS/GuildSync-Backend-Server/package.json" "NodeJS/GuildSync-Backend-Server/package-lock.json" "NodeJS/GuildSync-Backend-Server/web/package.json" "NodeJS/GuildSync-Backend-Server/web/package-lock.json" "NodeJS/GuildSync-Discord-Bot/package.json" "NodeJS/GuildSync-Discord-Bot/package-lock.json" "ESO/GuildSyncBanking/GuildSyncBanking.txt" "ESO/GuildSyncRoster/GuildSyncRoster.txt" "ESO/GuildSyncApplications/GuildSyncApplications.txt" "NodeJS/GuildSync-Backend-Server/.env.example"
            else
              echo "A newer release exists ($LATEST_TAG); preserving source versions while adding installers."
            fi
            for platform in Windows macOS Linux-x86_64; do
              git add -- "NodeJS/GuildSync-Backend-Server/public/downloads/GuildSync-Setup-$VERSION-$platform.zip"
            done
            if git diff --cached --quiet; then
              echo "Installer downloads and source versions already match this release."
              exit 0
            fi
            git commit -m "Publish GuildSync $VERSION downloads and source versions"
            CURRENT_LATEST="$(gh api --paginate --slurp "repos/$GH_REPO/releases" | python3 ../release-source/tools/latest-published-release.py)"
            if [[ "$LATEST_TAG" != "$CURRENT_LATEST" ]]; then continue; fi
            if git push --force-with-lease="refs/heads/$BRANCH:$REMOTE_HEAD" origin "HEAD:refs/heads/$BRANCH"; then
              EXISTING_PR="$(gh pr list --state open --base master --head "$BRANCH" --json url --jq '.[0].url // empty')"
              if [[ -z "$EXISTING_PR" ]]; then
                gh pr create --base master --head "$BRANCH" \
                  --title "Publish GuildSync $VERSION downloads and source versions" \
                  --body "Publish installer ZIPs in public/downloads and update source version fields for the latest published release. Compiled web files remain deployment artifacts and are not committed."
              else
                echo "Version update already proposed: $EXISTING_PR"
              fi
              PROPOSED=true
              break
            fi
          done
          if [[ "$PROPOSED" != true ]]; then
            echo "Could not publish the version branch. Check Actions write permissions." >&2
            exit 1
          fi
      - name: Upload ZIPs to running server
        if: vars.GUILDSYNC_DEPLOY_DOWNLOADS_ENABLED == 'true'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GUILDSYNC_DEPLOY_HOST: ${{ secrets.GUILDSYNC_DEPLOY_HOST }}
          GUILDSYNC_DEPLOY_USER: ${{ secrets.GUILDSYNC_DEPLOY_USER }}
          GUILDSYNC_DEPLOY_PORT: ${{ vars.GUILDSYNC_DEPLOY_PORT }}
          GUILDSYNC_DEPLOY_SSH_KEY: ${{ secrets.GUILDSYNC_DEPLOY_SSH_KEY }}
          GUILDSYNC_DEPLOY_KNOWN_HOSTS: ${{ secrets.GUILDSYNC_DEPLOY_KNOWN_HOSTS }}
          GUILDSYNC_DEPLOY_DOWNLOADS_DIR: ${{ vars.GUILDSYNC_DEPLOY_DOWNLOADS_DIR }}
        run: bash release-source/tools/upload-release-downloads.sh
      - name: Report server upload configuration
        if: vars.GUILDSYNC_DEPLOY_DOWNLOADS_ENABLED != 'true'
        run: echo "::warning::Installers are available as GitHub Release assets and proposed in a repository pull request. Server upload is disabled until GUILDSYNC_DEPLOY_DOWNLOADS_ENABLED=true and SSH settings are configured. Rebuild or deploy the compiled web UI separately."




